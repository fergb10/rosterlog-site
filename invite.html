<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RosterLog — Invitación de Espectador</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <meta property="og:title" content="Te invitaron a RosterLog">
    <meta property="og:description" content="Usa el código para ver el calendario de vuelos de tu tripulante.">
    <meta property="og:image" content="https://rosterlog.app/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="apple-itunes-app" content="app-id=6761634082, app-argument=rosterlog://invite">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1d1d1f; background: #f5f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
        .card { background: #fff; border-radius: 20px; padding: 40px 32px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
        .icon { width: 72px; height: 72px; border-radius: 22.5%; display: block; margin: 0 auto 16px; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
        h1 { font-size: 22px; margin-bottom: 8px; }
        .code { font-family: monospace; font-size: 28px; font-weight: 700; color: #007aff; letter-spacing: 2px; margin: 16px 0; }
        p { font-size: 15px; color: #666; margin-bottom: 20px; }
        .btn { display: inline-block; background: #007aff; color: #fff; text-decoration: none; padding: 14px 32px; border-radius: 12px; font-size: 17px; font-weight: 600; }
        .btn:hover { background: #0056cc; }
        .btn.secondary { background: transparent; color: #007aff; border: 1px solid #007aff; margin-top: 12px; }
        .btn.secondary:hover { background: #f0f7ff; }
        .note { font-size: 13px; color: #999; margin-top: 16px; }
    </style>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code') || '';
        document.addEventListener('DOMContentLoaded', function() {
            if (code) {
                document.getElementById('code').textContent = code;
                const meta = document.querySelector('meta[name="apple-itunes-app"]');
                if (meta) {
                    meta.setAttribute('content', 'app-id=6761634082, app-argument=rosterlog://invite?code=' + encodeURIComponent(code));
                }
                const openBtn = document.getElementById('open-app');
                if (openBtn) {
                    openBtn.href = 'rosterlog://invite?code=' + encodeURIComponent(code);
                }
            }
        });
    </script>
</head>
<body>
    <div class="card">
        <img class="icon" src="/assets/app-icon.webp" width="72" height="72" alt="RosterLog">
        <h1>Te invitaron a RosterLog</h1>
        <p>Usa este código para ver el calendario de vuelos de tu tripulante.</p>
        <div class="code" id="code">--------</div>
        <a class="btn" href="https://apps.apple.com/mx/app/rosterlog/id6761634082">Descargar RosterLog</a>
        <a class="btn secondary" id="open-app" href="rosterlog://invite">Ya tengo la app — abrir</a>
        <p class="note">Si ya tienes la app, toca "Abrir" y se ingresará el código automáticamente.</p>
    </div>
</body>
</html>
